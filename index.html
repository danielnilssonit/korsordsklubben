      Bus.on('net:put', e => { board.remotePut(e.cell, e.ch, { ts: e.ts, by: e.by, shown: e.shown }); drawPeers(); }),
      Bus.on('net:state', () => board.refresh()),
      Bus.on('net:done', x => toast(`${x.name} skrev sista bokstaven. Krysset är löst!`, { icon: 'star' }))
    ];
    const oldDestroy = board.destroy.bind(board);
    board.destroy = () => { offs.forEach(f => f()); oldDestroy(); };
    drawPeers();
    if (R.host && !Store.get('invited.' + R.code, false)) { Store.set('invited.' + R.code, true); setTimeout(() => inviteSheet(R.code), 300); }
  }

  function inviteSheet(code) {
    const url = Net.link(code);

    T.qr(qr, url);
    const share = navigator.share ? btn('Dela länken', { icon: 'link', kind: 'primary', big: true, onClick: () => navigator.share({ title: 'Korsordsklubben', text: 'Kom och lös krysset med mig!', url }).catch(() => {}) }) : null;
    sheet({ title: 'Bjud in', icon: 'people', wide: true, body: [
      h('div.invite',
        h('div.invite-code', h('small', 'Koden'), h('strong', [...code].map(c => h('span', c))), h('p', 'Den andra trycker på Lös tillsammans och skriver koden.')),
        qr),
      h('p', 'Eller skicka länken, till exempel i ett sms:'),
      h('p.link', url)
    ], buttons: [share, btn('Kopiera länken', { icon: 'copy', big: true, onClick: () => copyText(url) }), { label: 'Klar', big: true }].filter(Boolean) });
  }
  function copyText(text) {
    const done = () => toast('Länken är kopierad.');

    else fallback();

        }
      }
      now.replaceChildren(h('small', 'Välkommen!'), h('p.tv-clue', 'Tryck på en ruta på plattan för att börja'), h('span', 'Ledtråden visas här, stort'));
    };
    const offs = [
      Bus.on('net:peers', e => { draw(); if (e && e.joined && e.joined.role !== 'tv') Sound.play('join'); }),
      Bus.on('net:put', e => { board.remotePut(e.cell, e.ch, { ts: e.ts, by: e.by, shown: e.shown }); draw(); }),
      Bus.on('net:state', () => { board.refresh(); draw(); })
    ];
    const oldDestroy = board.destroy.bind(board);
    board.destroy = () => { offs.forEach(f => f()); oldDestroy(); };
    board.opts.onSolved = () => { now.replaceChildren(h('small', 'Grattis allihop!'), h('p.tv-clue', 'Krysset är löst!'), h('span', 'Bra jobbat tillsammans')); Sound.play('solved'); setTimeout(() => Voice.say('app_tillsammans_klart'), 900); };
    // tv:n märker när krysset blir löst av någon annan
    const solvedCheck = setInterval(() => { if (!board.root.isConnected) { clearInterval(solvedCheck); return; } if (!board.prog.done && board.prog.isSolved()) { board.prog.done = true; board.prog.save(true); board.opts.onSolved(); } }, 1000);
    draw();
  }
  return TV;
})();

/* ---- 15-print.js ---- */
/* ================= Skriv ut ================= */
// Dagens kryss på papper (A4), med stora rutor och ledtrådarna i rutorna som i tidningen. Facit på en egen sida om
// man vill. Tänkt både för den som vill lösa med penna hemma och för träffpunkten, som kan dela ut veckans kryss.
const Print = (() => {
  const PR = {};
  PR.start = (main, id) => {
    const today = dayStr();
    let which = id ? [id] : [Daily.forDay(today, 'L'), Daily.forDay(today, 'S')].filter(Boolean).map(p => p.id);
    let withKey = false;
    const pages = h('div.print-pages');
    const draw = () => {
      pages.replaceChildren();
      const list = which.map(x => Daily.get(x)).filter(Boolean);
      list.forEach(p => pages.append(page(p, false)));
      if (withKey) pages.append(keyPage(list));
      requestAnimationFrame(() => $$('.pp-grid', pages).forEach(g => g._fit && g._fit()));
    };
    const keyToggle = h('input', { type: 'checkbox', id: 'pp-key' });
    const keyState = h('span.tgl-state', 'Av');
    keyToggle.addEventListener('change', () => { withKey = keyToggle.checked; keyState.textContent = withKey ? 'På' : 'Av'; draw(); });
    const pick = id ? null : choicePick(v => { which = v === 'both' ? [Daily.forDay(today, 'L').id, Daily.forDay(today, 'S').id] : [Daily.forDay(today, v).id]; draw(); });
    main.replaceChildren(
      h('header.kk-top.noprint', btn('Tillbaka', { icon: 'left', kind: 'ghost', onClick: () => history.length > 1 ? history.back() : App.go('') }),
        h('div.top-title', h('strong', 'Skriv ut'), h('span', id ? Daily.get(id).title : 'Dagens kryss på papper')),
        !ARTIFACT && btn('Skriv ut', { icon: 'print', kind: 'primary', big: true, onClick: () => window.print() })),
      h('div.page.print-page',
        h('div.print-opts.noprint',
          pick,
          h('label.tgl', { for: 'pp-key' }, h('span.tgl-text', h('strong', 'Med facit'), h('small', 'Svaren på en egen sida sist')), keyToggle, h('span.tgl-sw', { 'aria-hidden': 'true' }, h('span')), keyState)),
        h('p.noprint.muted', 'Så här blir papperet. Tryck på Skriv ut och välj skrivaren. Krysset får plats på ett A4 på höjden.'),
        pages));
    draw();
  };
  function choicePick(onPick) {
    let cur = 'both';
    const row = h('div.choice-row');
    const drawRow = () => row.replaceChildren(...[['both', 'Båda kryssen'], ['L', 'Lilla krysset'], ['S', 'Stora krysset']].map(([v, t]) =>
      h('button.chip', { type: 'button', class: cur === v ? 'on' : '', 'aria-pressed': cur === v ? 'true' : 'false', onclick: () => { cur = v; drawRow(); onPick(v); } }, cur === v && icon('check', 20, 3), t)));
    drawRow();
    return h('div.choice', h('strong', 'Vilket kryss?'), row);
  }
  // En A4-sida: rubrik, krysset och en rad för namnet
  function page(p, key) {
    const day = Daily.dayOf(p.id);
    const g = new GridView(p, { mode: 'print' });
    const prog = key ? { get: i => p.cells[i].answer || '', wrong: () => false, shown: new Set() } : null;
    const box = h('div.pp-grid', g.el);
    // rutornas storlek efter sidans bredd (180 mm) och höjd (230 mm), i skärmpixlar (96 per tum)
    box._fit = () => { const mm = 3.78; const cs = Math.floor(Math.min(180 * mm / p.w, 232 * mm / p.h)); g.setSize(cs); g.update(prog); };
    return h('section.pp',
      h('header.pp-h', h('div', h('strong', 'Korsordsklubben'), h('span', ` · ${p.title}`)), h('span', day ? cap(dayLabel(day, { rel: false })) : '')),
      box,
      h('footer.pp-f', h('span', 'Namn: ______________________'), h('span', 'Träffpunkt Hemma · Lös också på plattan')));
  }
  // Facit: alla kryssen små på en sida
  function keyPage(list) {
    const wrap = h('div.pp-keys');
    for (const p of list) {
      const g = new GridView(p, { mode: 'print' });
      const box = h('div.pp-key', h('h3', `Facit: ${p.title}`), g.el);
      box._fit = () => { g.setSize(Math.floor(Math.min(86 * 3.78 / p.w, 100 * 3.78 / p.h))); g.update({ get: i => p.cells[i].answer || '', wrong: () => false, shown: new Set() }); };
      box.classList.add('pp-grid');
      wrap.append(box);
    }
    return h('section.pp.pp-facit', h('header.pp-h', h('div', h('strong', 'Korsordsklubben'), h('span', ' · Facit')), h('span', cap(dayLabel(dayStr(), { rel: false })))), wrap);
  }
  return PR;
})();

/* ---- 16-main.js ---- */
/* ================= Start och navigering ================= */
// Adresser: # (start), #kryss/<id>, #arkiv, #installningar, #hjalp, #tillsammans[/<id>], #rum=<kod>, #tv, #skrivut[/<id>]
const App = (() => {
  const A = { board: null };
  let main = null;
  A.applySettings = () => {
    const el = $('#app');
    // mörkt: eget val, annars som tittarens tema (klassen på <html> styr färgerna, se 00-tokens.css)
    const d = Settings.get('dark'), root = document.documentElement;
    root.classList.toggle('kk-dark', d === 'on');
    root.classList.toggle('kk-light', d === 'off');
    el.classList.toggle('dark', d === 'on' || (d === 'auto' && (root.dataset.theme === 'dark' || (root.dataset.theme !== 'light' && !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)))));
    el.classList.toggle('fs-stor', Settings.get('fs') === 'stor');
    el.classList.toggle('fs-xstor', Settings.get('fs') === 'xstor');
  };
  A.go = route => {
    const h2 = route ? '#' + route : '#';
    if (location.hash === h2 || (!route && !location.hash)) A.route(); else location.hash = h2;
  };
  A.route = () => {
    if (A.board) { A.board.destroy(); A.board = null; }
    if (typeof Net !== 'undefined' && Net.leaveIfNot) Net.leaveIfNot(location.hash);
    $$('.sheet-bg').forEach(e => e.remove());
    Voice.stop();
    const r = decodeURIComponent(location.hash.replace(/^#/, ''));
    const [name, arg] = r.split('/');
    document.body.classList.toggle('kk-tvmode', name === 'tv');
    main.className = 'kk-main r-' + (name || 'hem').replace(/=.*/, '');
    window.scrollTo(0, 0);
    if (name === 'kryss' && arg) Screens.play(main, arg);
    else if (name === 'arkiv') Screens.archive(main);
    else if (name === 'installningar') Screens.settings(main);
    else if (name === 'hjalp') Screens.help(main);
    else if (name === 'tillsammans' && typeof Together !== 'undefined') Together.start(main, arg);
    else if (name.startsWith('rum=') && typeof Together !== 'undefined') Together.join(main, name.slice(4));
    else if (name === 'tv' && typeof Tv !== 'undefined') Tv.start(main, arg);
    else if (name === 'skrivut' && typeof Print !== 'undefined') Print.start(main, arg);
    else Screens.home(main);
  };
  A.boot = () => {
    const app = $('#app');
    main = h('main.kk-main');
    app.replaceChildren(main);
    A.applySettings();
    window.addEventListener('hashchange', A.route);
    if (window.matchMedia) try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', A.applySettings); } catch (e) { /* äldre webbläsare */ }
    try { new MutationObserver(A.applySettings).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] }); } catch (e) { /* går inte */ }
    document.addEventListener('pointerdown', () => Sound.unlock(), { once: true });
    A.route();
  };
  return A;
})();

if (/[?&]debug/.test(location.search)) window.KK = {App: typeof App !== 'undefined' ? App : null, Board: typeof Board !== 'undefined' ? Board : null, Puzzle: typeof Puzzle !== 'undefined' ? Puzzle : null, Progress: typeof Progress !== 'undefined' ? Progress : null, Daily: typeof Daily !== 'undefined' ? Daily : null, Settings: typeof Settings !== 'undefined' ? Settings : null, Store: typeof Store !== 'undefined' ? Store : null, Bus: typeof Bus !== 'undefined' ? Bus : null, Fit: typeof Fit !== 'undefined' ? Fit : null, Sound: typeof Sound !== 'undefined' ? Sound : null, Voice: typeof Voice !== 'undefined' ? Voice : null, Net: typeof Net !== 'undefined' ? Net : null, Mqtt: typeof Mqtt !== 'undefined' ? Mqtt : null, Tv: typeof Tv !== 'undefined' ? Tv : null, Print: typeof Print !== 'undefined' ? Print : null, Screens: typeof Screens !== 'undefined' ? Screens : null, PUZZLES: typeof PUZZLES !== 'undefined' ? PUZZLES : null};

App.boot();
})();
