<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta property="og:title" content="Korsordsklubben">
<meta property="og:description" content="Dagens kryss, med ledtrådarna i rutorna. Lös själv eller tillsammans.">
<meta property="og:image" content="https://danielnilssonit.github.io/korsordsklubben/og.png">
<meta name="theme-color" content="#1D5E86">
<title>Korsordsklubben</title>
<meta name="description" content="Svenska korsord med ledtrådarna i rutorna. Dagens kryss, lös tillsammans och skriv ut. En del av Träffpunkt Hemma.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700;800&family=Bitter:wght@600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700&display=swap&text=0123456789">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon-32.png">
<style>
/* ================= Färger, typsnitt och grund ================= */
/* Samma palett och typsnitt som plattan i Träffpunkt Hemma, så att krysset känns som en del av tjänsten.
   Atkinson Hyperlegible är gjort för dem som ser dåligt; siffrorna kommer från Lexend (tydlig nolla). */
:root {
  --f-ui: Lexend, "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", Verdana, "Segoe UI", system-ui, sans-serif;
  --f-grid: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", Verdana, "Segoe UI", system-ui, sans-serif;
  --f-display: Bitter, "Roboto Slab", Georgia, "Times New Roman", serif;
  --fs: 1;

  --paper: #F1F4EF;
  --card: #FFFFFF;
  --ink: #15233A;
  --ink2: #475569;
  --line: #D3DBE2;
  --line2: #E6EBEF;
  --primary: #1D5E86;
  --primary-hi: #174E70;
  --primary-soft: #E2EEF6;
  --primary-ink: #FFFFFF;
  --ok: #2B7A4B;
  --ok-soft: #E2F2E8;
  --ok-ink: #FFFFFF;
  --danger: #B13A2E;
  --danger-soft: #FBE7E4;
  --lamp: #F2A516;
  --lamp-hi: #FFD27A;
  --lamp-ink: #2E2100;
  --lamp-soft: #FFF3D6;
  --rail: #15233A;

  /* krysset */
  --g-line: #8E9EAE;        /* linjerna i rutnätet */
  --g-frame: #15233A;       /* ramen runt krysset */
  --g-cell: #FFFFFF;
  --g-clue: #D0D2CD;        /* ledtrådsrutorna: neutral grå, tydligt mörkare än de vita */
  --g-clue-ink: #15233A;
  --g-word: #A8D3F2;        /* ordet man skriver i (har också en ram) */
  --g-word-edge: #1D5E86;   /* ramen runt ordet */
  --g-cur: #FFD27A;         /* rutan man står i */
  --g-cur-edge: #F2A516;
  --g-wrong: #B13A2E;
  --g-shown: #8A6100;       /* bokstäver man har fått hjälp med */
  --g-arrow: #3B4B60;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not(.kk-light) { color-scheme: dark;
  --paper: #101926; --card: #182334; --ink: #EDF2F7; --ink2: #A9B6C6; --line: #2B3A4F; --line2: #223044;
  --primary: #6DB3DE; --primary-hi: #8AC4E8; --primary-soft: #1B3044; --primary-ink: #0B1622; --ok: #53B57E; --ok-soft: #173025; --ok-ink: #0B1622;
  --danger: #E5776B; --danger-soft: #3A1F1B; --lamp-soft: #3A2E12; --rail: #070D16;
  --g-line: #4A5B70; --g-frame: #0A111C; --g-cell: #1D2A3D; --g-clue: #3A4B64; --g-clue-ink: #EEF2F7; --g-word: #24557A; --g-word-edge: #8AC4E8; --g-cur: #8C6412;
  --g-cur-edge: #F2A516; --g-wrong: #FF8A7D; --g-shown: #FFC247; --g-arrow: #B9C6D6;
  }
}
:root[data-theme="dark"]:not(.kk-light), :root.kk-dark, .kk.dark { color-scheme: dark;
  --paper: #101926; --card: #182334; --ink: #EDF2F7; --ink2: #A9B6C6; --line: #2B3A4F; --line2: #223044;
  --primary: #6DB3DE; --primary-hi: #8AC4E8; --primary-soft: #1B3044; --primary-ink: #0B1622; --ok: #53B57E; --ok-soft: #173025; --ok-ink: #0B1622;
  --danger: #E5776B; --danger-soft: #3A1F1B; --lamp-soft: #3A2E12; --rail: #070D16;
  --g-line: #4A5B70; --g-frame: #0A111C; --g-cell: #1D2A3D; --g-clue: #3A4B64; --g-clue-ink: #EEF2F7; --g-word: #24557A; --g-word-edge: #8AC4E8; --g-cur: #8C6412;
  --g-cur-edge: #F2A516; --g-wrong: #FF8A7D; --g-shown: #FFC247; --g-arrow: #B9C6D6;
}
.kk.fs-stor { --fs: 1.12; }
.kk.fs-xstor { --fs: 1.26; }

html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--f-ui); -webkit-font-smoothing: antialiased; overscroll-behavior: none; }
.kk { min-height: 100%; height: 100%; background: var(--paper); color: var(--ink); font-size: calc(20px * var(--fs)); line-height: 1.4; }
:where(.kk) button, :where(.kk) input, :where(.kk) select { font: inherit; color: inherit; }
.kk button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
.kk button:disabled { cursor: default; }
.kk :focus-visible { outline: 3px solid var(--lamp); outline-offset: 2px; }
.kk h1, .kk h2, .kk h3, .kk p { margin: 0; }
.kk h1, .kk h2, .kk h3 { text-wrap: balance; }
.kk ul, .kk ol { margin: 0; padding: 0; list-style: none; }
.ic { flex: none; display: block; }
.kk-loading { display: grid; place-items: center; height: 100%; font-size: 24px; color: var(--ink2); }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}

/* ================= Ramen: överst, sidorna, knappar och rutor ================= */
.kk-main { display: flex; flex-direction: column; height: 100%; min-height: 0; }
.kk-top { flex: none; display: flex; align-items: center; gap: 12px; padding: 10px 18px; min-height: 76px; box-sizing: border-box; background: var(--card); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 12px; margin-right: auto; }
.brand-ic { width: 52px; height: 52px; border-radius: 14px; background: var(--rail); color: #fff; display: grid; place-items: center; flex: none; }
.brand-t { display: flex; flex-direction: column; line-height: 1.15; }
.brand-t strong { font-family: var(--f-display); font-size: calc(26px * var(--fs)); }
.brand-t small { font-size: calc(16px * var(--fs)); color: var(--ink2); }
.top-date { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.2; }
.top-date strong { font-size: calc(22px * var(--fs)); }
.top-date span { color: var(--ink2); font-size: calc(18px * var(--fs)); }
.top-title { display: flex; flex-direction: column; line-height: 1.2; margin-right: auto; min-width: 0; }
.top-title strong { font-family: var(--f-display); font-size: calc(24px * var(--fs)); }
.top-title span { color: var(--ink2); font-size: calc(17px * var(--fs)); }
.top-count { color: var(--ink2); font-size: calc(18px * var(--fs)); font-variant-numeric: tabular-nums; white-space: nowrap; }

.page { flex: 1; min-height: 0; overflow-y: auto; padding: 22px 24px 32px; display: flex; flex-direction: column; gap: 18px; box-sizing: border-box; width: 100%; max-width: 1180px; margin: 0 auto; }
.lead { font-size: calc(21px * var(--fs)); color: var(--ink2); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; }

/* Knappar (som i Träffpunkt Hemma) */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 58px; padding: 0 20px; border-radius: 14px; border: 2px solid var(--primary); background: var(--card); color: var(--primary);
  font-weight: 700; font-size: calc(20px * var(--fs)); text-decoration: none; line-height: 1.15; text-align: center; transition: transform .1s, background .15s, box-shadow .15s; box-sizing: border-box; user-select: none; }
.btn:active:not(:disabled) { transform: scale(.98); }
.btn:disabled { opacity: .42; }
.btn-secondary:hover:not(:disabled) { background: var(--primary-soft); }
.btn-primary { background: var(--primary); color: var(--primary-ink); }
.btn-primary:hover:not(:disabled) { background: var(--primary-hi); border-color: var(--primary-hi); }
.btn-ok { background: var(--ok); border-color: var(--ok); color: var(--ok-ink); }
.btn-danger { border-color: var(--danger); color: var(--danger); }
.btn-danger:hover:not(:disabled) { background: var(--danger-soft); }
.btn-lamp { background: var(--lamp); border-color: var(--lamp); color: var(--lamp-ink); }
.btn-ghost { border-color: transparent; background: transparent; color: var(--primary); }
.btn-ghost:hover { background: var(--primary-soft); }
.btn-big { min-height: 68px; padding: 0 26px; font-size: calc(22px * var(--fs)); border-radius: 16px; }
.btn-small { min-height: 50px; padding: 0 14px; font-size: calc(18px * var(--fs)); border-radius: 12px; gap: 8px; }

/* Startsidan */
.home-head h1 { font-family: var(--f-display); font-size: calc(40px * var(--fs)); letter-spacing: -.01em; }
.home-head .lead { margin-top: 4px; max-width: 46em; }
.daycards { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.daycard { flex-direction: row; align-items: center; gap: 20px; padding: 20px; }
.daycard.st-done { border-color: var(--ok); }
.dc-grid { flex: none; padding: 8px; background: var(--paper); border-radius: 12px; line-height: 0; }
.dc-body { display: flex; flex-direction: column; gap: 8px; min-width: 0; align-items: flex-start; }
.dc-body h2 { font-family: var(--f-display); font-size: calc(30px * var(--fs)); }
.dc-sub { color: var(--ink2); font-size: calc(18px * var(--fs)); }
.dc-st { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: calc(19px * var(--fs)); color: var(--ink2); min-height: 32px; }
.st-done .dc-st { color: var(--ok); }
.bar { width: 110px; height: 12px; border-radius: 99px; background: var(--line2); overflow: hidden; display: inline-block; }
.bar i { display: block; height: 100%; background: var(--primary); border-radius: 99px; }
.home-more { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.more { display: flex; align-items: center; gap: 14px; text-align: left; padding: 14px 16px; border-radius: 18px; border: 2px solid var(--line); background: var(--card); min-height: 84px; }
.more:hover { border-color: var(--primary); background: var(--primary-soft); }
a.more { color: inherit; text-decoration: none; }
.more-ic { width: 54px; height: 54px; border-radius: 16px; background: var(--primary-soft); color: var(--primary); display: grid; place-items: center; flex: none; }
.more-t { display: flex; flex-direction: column; }
.more-t strong { font-size: calc(21px * var(--fs)); }
.more-t small { color: var(--ink2); font-size: calc(17px * var(--fs)); }
.mini { display: block; border-radius: 3px; }

.themed h2 { font-family: var(--f-display); font-size: calc(24px * var(--fs)); margin-bottom: 8px; }
.themed-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }

.continue { flex-direction: row; align-items: center; gap: 18px; border-color: var(--lamp); background: var(--lamp-soft); }
.continue h2 { font-family: var(--f-display); font-size: calc(26px * var(--fs)); }

/* Tidigare kryss */
.days { display: flex; flex-direction: column; gap: 14px; }
.day h3 { font-size: calc(21px * var(--fs)); margin-bottom: 8px; }
.day-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.atile { position: relative; display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 16px; border: 2px solid var(--line); background: var(--card); text-align: left; min-height: 88px; }
.atile:hover { border-color: var(--primary); }
.atile.st-done { border-color: var(--ok); }
.at-t { display: flex; flex-direction: column; }
.at-t strong { font-size: calc(20px * var(--fs)); }
.at-t small { color: var(--ink2); font-size: calc(17px * var(--fs)); }
.at-ok { position: absolute; right: 12px; top: 12px; color: var(--ok); }

/* Inställningar */
.settings .card { gap: 4px; max-width: 820px; }
.choice { display: flex; flex-direction: column; gap: 8px; padding: 12px 0; border-top: 1px solid var(--line2); }
.choice:first-child { border-top: 0; }
.choice-row { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 8px; min-height: 52px; padding: 0 16px; border-radius: 14px; border: 2px solid var(--line); background: var(--card); font-weight: 700; font-size: calc(19px * var(--fs)); }
.chip.on { border-color: var(--primary); background: var(--primary-soft); color: var(--primary); }
.tgl { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-top: 1px solid var(--line2); cursor: pointer; }
.tgl-text { flex: 1; display: flex; flex-direction: column; }
.tgl-text small { color: var(--ink2); font-size: calc(17px * var(--fs)); }
.tgl input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.tgl-sw { width: 66px; height: 38px; border-radius: 999px; background: #AEB9C4; position: relative; flex: none; transition: background .2s; }
.tgl-sw span { position: absolute; top: 4px; left: 4px; width: 30px; height: 30px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); }
.tgl input:checked + .tgl-sw { background: var(--ok); }
.tgl input:checked + .tgl-sw span { transform: translateX(28px); }
.tgl input:focus-visible + .tgl-sw { outline: 3px solid var(--lamp); outline-offset: 2px; }
.tgl-state { width: 32px; font-weight: 800; }
.name-row { display: flex; flex-direction: column; gap: 4px; padding: 12px 0; border-top: 1px solid var(--line2); }
.name-row small { color: var(--ink2); font-size: calc(17px * var(--fs)); }
.name-in { min-height: 56px; border: 2px solid var(--line); border-radius: 14px; padding: 0 14px; font-size: calc(21px * var(--fs)); background: var(--card); max-width: 360px; }
.name-in:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
.version { color: var(--ink2); font-size: 15px; }
.help .card { max-width: 820px; gap: 12px; }
.help h2 { font-family: var(--f-display); font-size: calc(24px * var(--fs)); margin-top: 6px; }

/* Rutor och meddelanden */
.sheet-bg { position: fixed; inset: 0; background: rgba(13, 24, 41, .56); display: grid; place-items: center; z-index: 40; padding: 20px; animation: fade .2s ease-out; }
.sheet-bg.out { opacity: 0; transition: opacity .2s; }
@keyframes fade { from { opacity: 0; } }
.sheet { background: var(--card); color: var(--ink); border-radius: 26px; padding: 22px 26px; width: min(680px, 100%); max-height: calc(100vh - 40px); overflow-y: auto; box-sizing: border-box;
  display: flex; flex-direction: column; gap: 14px; box-shadow: 0 30px 80px rgba(0, 0, 0, .35); animation: pop .25s ease-out; font-size: calc(20px * var(--fs)); }
.sheet.wide { width: min(860px, 100%); }
@keyframes pop { from { transform: translateY(12px) scale(.98); opacity: 0; } }
.sheet-h { display: flex; align-items: center; gap: 12px; }
.sheet-h h2 { flex: 1; font-family: var(--f-display); font-size: calc(28px * var(--fs)); }
.sheet-ic { width: 52px; height: 52px; border-radius: 16px; background: var(--primary-soft); color: var(--primary); display: grid; place-items: center; flex: none; }
.sheet-x { min-height: 52px; padding: 0 12px; }
.sheet-body { display: flex; flex-direction: column; gap: 6px; }
.sheet-f { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 4px; position: sticky; bottom: -22px; background: var(--card); padding: 10px 0 4px; }
.menu-actions { display: flex; flex-wrap: wrap; gap: 10px; padding-top: 14px; border-top: 1px solid var(--line2); margin-top: 6px; }
.steps { display: flex; flex-direction: column; gap: 12px; }
.steps li { display: flex; gap: 14px; align-items: flex-start; font-size: calc(20px * var(--fs)); }
.steps b { flex: none; width: 40px; height: 40px; border-radius: 50%; background: var(--primary); color: var(--primary-ink); display: grid; place-items: center; font-size: 20px; }
.solved { text-align: center; align-items: center; }
.solved .sheet-body { align-items: center; gap: 10px; }
.solved .sheet-f { justify-content: center; }
.solved-star { color: var(--lamp); animation: starpop .6s ease-out; }
.solved-h { font-family: var(--f-display); font-size: calc(34px * var(--fs)); }
@keyframes starpop { 0% { transform: scale(.4) rotate(-30deg); opacity: 0; } 70% { transform: scale(1.1) rotate(6deg); } }

.toasts { position: fixed; top: 88px; right: 18px; z-index: 50; display: flex; flex-direction: column; gap: 10px; width: min(460px, calc(100vw - 36px)); pointer-events: none; }
.toast { display: flex; align-items: center; gap: 12px; background: var(--card); color: var(--ink); border: 2px solid var(--line); border-left: 7px solid var(--lamp); border-radius: 16px; padding: 12px 14px;
  box-shadow: 0 14px 34px rgba(21, 35, 58, .2); animation: slide .3s ease-out; font-size: calc(19px * var(--fs)); }
.toast.out { opacity: 0; transform: translateX(20px); transition: all .3s; }
.toast p { flex: 1; }
.toast-ic { width: 44px; height: 44px; border-radius: 50%; background: var(--lamp-soft); display: grid; place-items: center; color: var(--ink); flex: none; }
@keyframes slide { from { transform: translateX(30px); opacity: 0; } }

@media screen and (max-width: 760px) {
  .kk-top { padding: 8px 12px; min-height: 64px; gap: 8px; }
  .brand-ic { width: 44px; height: 44px; }
  .top-count { display: none; }
  .page { padding: 16px 14px 28px; }
  .daycards, .day-tiles { grid-template-columns: 1fr; }
  .daycard { padding: 14px; gap: 14px; }
  .home-head h1 { font-size: calc(32px * var(--fs)); }
}
@media screen and (max-width: 560px) {
  .kk-top > .btn { min-height: 50px; padding: 0 12px; }
  .kk-top > .btn span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .top-title strong { font-size: calc(20px * var(--fs)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top-title span { font-size: calc(15px * var(--fs)); }
  .brand-t strong { font-size: calc(21px * var(--fs)); }
  .top-date strong { font-size: calc(18px * var(--fs)); }
  .top-date span { font-size: calc(15px * var(--fs)); }
}

/* ================= Spelplanen ================= */
.board-root { flex: 1; min-height: 0; position: relative; }
.kx-board { --kh: 60px; position: absolute; inset: 0; display: flex; gap: 16px; padding: 12px; box-sizing: border-box; color: var(--ink); }
.kx-board.wide { flex-direction: row; align-items: stretch; }
.kx-board.tall { flex-direction: column; gap: 8px; padding: 8px; }
.kx-gridbox { flex: 1; min-width: 0; min-height: 0; display: grid; place-items: center; }
.kx-board.tall .kx-gridbox { flex: 1 1 auto; }
.kx-side { flex: none; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
.kx-board.tall .kx-side { gap: 8px; }

/* Rutnätet */
.kx-grid { --cs: 60px; position: relative; display: grid; grid-template-columns: repeat(var(--w), var(--cs)); grid-auto-rows: var(--cs); gap: 1px; background: var(--g-line);
  border: 3px solid var(--g-frame); border-radius: 4px; font-family: var(--f-grid); user-select: none; -webkit-user-select: none; touch-action: manipulation; }
.kx-c, .kx-q { position: relative; overflow: hidden; box-sizing: border-box; }
.kx-c { background: var(--g-cell); display: grid; place-items: center; cursor: pointer; transition: background .12s; }
.kx-l { font-size: calc(var(--cs) * .6); font-weight: 700; line-height: 1; color: var(--ink); transform: translateY(4%); }
.kx-c.word { background: var(--g-word); }
.kx-c.cur { background: var(--g-cur); box-shadow: inset 0 0 0 3px var(--g-cur-edge); }
.kx-c.wrong .kx-l { color: var(--g-wrong); }
.kx-c.wrong::after { content: ''; position: absolute; right: 8%; bottom: 8%; width: 14%; height: 14%; border-radius: 50%; background: var(--g-wrong); }
.kx-c.shown::before { content: ''; position: absolute; right: 0; top: 0; border-style: solid; border-width: 0 calc(var(--cs) * .22) calc(var(--cs) * .22) 0; border-color: transparent var(--g-shown) transparent transparent; opacity: .85; }
.kx-c.shown .kx-l { color: var(--g-shown); }
.kx-c.flash { animation: flash .6s ease-out; }
@keyframes flash { 30% { background: var(--ok-soft); } }
.kx-c.peer { box-shadow: inset 0 0 0 3px var(--peer); }
.kx-c.peer::after { content: attr(data-peer); position: absolute; left: 2px; bottom: 1px; right: auto; top: auto; width: auto; height: auto; border-radius: 4px; background: var(--peer); color: #fff;
  font-size: calc(var(--cs) * .16); font-weight: 800; padding: 0 3px; line-height: 1.25; max-width: 90%; overflow: hidden; white-space: nowrap; }
.kx-ar { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

const parseDay = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12); };
// Antal dagar mellan två datum (text), oberoende av sommartid
const daysBetween = (a, b) => Math.round((Date.UTC(...b.split('-').map((v, i) => i === 1 ? v - 1 : +v)) - Date.UTC(...a.split('-').map((v, i) => i === 1 ? v - 1 : +v))) / 864e5);
const addDays = (s, n) => { const d = parseDay(s); d.setDate(d.getDate() + n); return dayStr(d); };
// "söndag 27 september", "i dag", "i går"
function dayLabel(s, { rel = true, weekday = true } = {}) {
  const d = parseDay(s), diff = daysBetween(s, dayStr());
  if (rel && diff === 0) return 'i dag';
  if (rel && diff === 1) return 'i går';
  return (weekday ? WEEKDAYS[d.getDay()] + ' ' : '') + d.getDate() + ' ' + MONTHS[d.getMonth()];
}
const minutesText = s => { const m = Math.max(1, Math.round(s / 60)); return m === 1 ? '1 minut' : `${m} minuter`; };

/* ---------- Lagring som tål att webbläsaren säger nej (privat läge, förhandsvisning) ---------- */
const Store = {
  mem: {},
  get(key, def) {
    try { const v = localStorage.getItem('kk.' + key); if (v != null) return JSON.parse(v); } catch (e) { /* ingen lagring */ }
    return key in this.mem ? this.mem[key] : def;
  },
  set(key, val) {
    this.mem[key] = val;
    try { localStorage.setItem('kk.' + key, JSON.stringify(val)); } catch (e) { /* ingen lagring */ }
  },
  del(key) { delete this.mem[key]; try { localStorage.removeItem('kk.' + key); } catch (e) { /* ingen lagring */ } }
};

/* ---------- Liten händelsebuss ---------- */
const Bus = {
  map: {},
  on(ev, fn) { (this.map[ev] = this.map[ev] || []).push(fn); return () => { this.map[ev] = (this.map[ev] || []).filter(f => f !== fn); }; },
  emit(ev, ...a) { (this.map[ev] || []).slice().forEach(fn => { try { fn(...a); } catch (e) { console.error(e); } }); }
};

/* ---- 01-puzzle.js ---- */
/* ================= Krysset: rutnätet, ledtrådarna och orden ================= */
// Ett kryss kommer som {id, size, w, h, grid, clues}. grid är en rad med w*h tecken: '#' är en ledtrådsruta,
// en bokstav är facit för en bokstavsruta. clues: [ruta, pil, ledtråd, svar].
// Pilarna: R = ordet börjar i rutan till höger och går åt höger, D = ordet börjar under och går nedåt,
// RD = börjar till höger men går nedåt, DR = börjar under men går åt höger.
const ARROWS = { R: { dx: 1, dy: 0, dir: 'A' }, D: { dx: 0, dy: 1, dir: 'D' }, RD: { dx: 1, dy: 0, dir: 'D' }, DR: { dx: 0, dy: 1, dir: 'A' } };

class Puzzle {
  constructor(data) {
    Object.assign(this, { id: data.id, size: data.size, w: data.w, h: data.h, data });
    const { w, h } = this, g = [...data.grid];
    this.cells = g.map((c, i) => ({ i, x: i % w, y: Math.floor(i / w), clue: c === '#', answer: c === '#' ? null : c, words: { A: -1, D: -1 }, parts: [], marks: [] }));
    this.words = [];
    for (const [cell, arrow, text, answer] of data.clues) {
      const a = ARROWS[arrow], src = this.cells[cell];
      let x = src.x + a.dx, y = src.y + a.dy;
      const cells = [];
      while (x < w && y < h && !this.cells[y * w + x].clue) { cells.push(y * w + x); if (a.dir === 'A') x++; else y++; }
      const word = { i: this.words.length, dir: a.dir, arrow, clueCell: cell, text, cells, len: cells.length, answer: cells.map(c => this.cells[c].answer).join('') };
      if (answer && answer !== word.answer) console.warn('Kryss', this.id, 'svaret stämmer inte:', answer, word.answer);
      this.words.push(word);
      cells.forEach(c => { this.cells[c].words[a.dir] = word.i; });
      src.parts.push(word.i);
      // pilen ritas i ordets första bokstavsruta, på den kant som ligger mot ledtrådsrutan
      this.cells[cells[0]].marks.push({ arrow, word: word.i });
    }
    // Två ledtrådar i samma ruta: den vars ord börjar till höger står överst, den vars ord börjar nedanför underst.
    // Pekar båda åt samma håll: den raka pilen först åt höger (R före RD), den böjda först nedåt (DR före D).
    const ORDER = { R: 0, RD: 1, DR: 2, D: 3 };
    for (const c of this.cells) if (c.parts.length > 1) c.parts.sort((a, b) => ORDER[this.words[a].arrow] - ORDER[this.words[b].arrow]);
    for (const c of this.cells) if (c.marks.length) c.marks.forEach(m => { const src = this.cells[this.words[m.word].clueCell]; m.part = src.parts.length > 1 ? (src.parts[0] === m.word ? 'top' : 'bottom') : 'full'; });
    this.letterCells = this.cells.filter(c => !c.clue).map(c => c.i);
    // ordning för "nästa ord": uppifrån och ned, vänster till höger efter första bokstaven, vågrätt före lodrätt
    this.order = this.words.map(x => x.i).sort((a, b) => { const A = this.words[a], B = this.words[b]; return A.cells[0] - B.cells[0] || (A.dir < B.dir ? -1 : 1); });
  }
  wordAt(cell, dir) { const c = this.cells[cell]; return c && !c.clue ? c.words[dir] : -1; }
  // Ett av rutans ord: i den riktning man vill om det finns, annars det andra
  pickDir(cell, want) { const c = this.cells[cell]; if (c.words[want] >= 0) return want; return want === 'A' ? 'D' : 'A'; }
  nextWord(wi, step = 1) { const k = this.order.indexOf(wi); return this.order[(k + step + this.order.length) % this.order.length]; }
  get title() { return this.data.title || (this.size === 'S' ? 'Stora krysset' : 'Lilla krysset'); }
  get theme() { return this.data.theme || null; }
}

/* ---- 02-progress.js ---- */
/* ================= Hur långt man har kommit i ett kryss ================= */
// Bokstäverna man har skrivit, vilka man har fått hjälp med och tiden. Sparas i webbläsaren per kryss
// (kk.p.<id>), så att man kan sluta och fortsätta senare. När man löser tillsammans har varje ruta en
// tidsstämpel, så att alla hamnar på samma bokstäver även om två skriver samtidigt.
class Progress {
  constructor(puzzle, { persist = true, key = null } = {}) {
    this.p = puzzle;
    this.key = key || 'p.' + puzzle.id;
    this.persist = persist;
    const n = puzzle.w * puzzle.h;
    this.letters = Array(n).fill('');
    this.by = Array(n).fill('');       // vem som skrev bokstaven (namn), när man löser tillsammans
    this.ts = Array(n).fill(0);        // tidsstämpel för rutan (när man löser tillsammans)
    this.shown = new Set();            // rutor man har fått hjälp med
    this.secs = 0; this.hints = 0; this.checks = 0; this.done = false; this.doneAt = null; this.started = null;
    if (persist) this.load();
  }
  // Kryssets fingeravtryck: sparat läge från en annan version av samma kryss (samma id, andra ord) används inte
  get sig() {
    if (!this._sig) { let x = 5381; for (const ch of this.p.data.grid) x = ((x * 33) ^ ch.charCodeAt(0)) >>> 0; this._sig = x.toString(36); }
    return this._sig;
  }
  load() {
    const s = Store.get(this.key, null);
    if (!s || !s.l) return;
    if (s.g && s.g !== this.sig) return;
    if (!s.g && s.l.length !== this.letters.length) return;
    [...s.l].forEach((c, i) => { if (i < this.letters.length && c !== '.' && !this.p.cells[i].clue) this.letters[i] = c; });
    (s.s || []).forEach(i => this.shown.add(i));
    Object.assign(this, { secs: s.t || 0, hints: s.h || 0, checks: s.c || 0, done: !!s.d, doneAt: s.da || null, started: s.st || null });
  }
  save(now = false) {
    if (!this.persist) return;
    clearTimeout(this._t);
    const go = () => Store.set(this.key, { g: this.sig, l: this.letters.map(c => c || '.').join(''), s: [...this.shown], t: Math.round(this.secs), h: this.hints, c: this.checks, d: this.done, da: this.doneAt, st: this.started });
    if (now) go(); else this._t = setTimeout(go, 150);
  }
  get(i) { return this.letters[i]; }
  // Skriv en bokstav (eller '' för att sudda). Ger true om något ändrades.
  set(i, ch, { by = '', ts = 0, shown = false } = {}) {
    if (this.p.cells[i].clue) return false;
    if (this.shown.has(i) && !shown) return false;           // en visad bokstav är facit och ändras inte
    if (this.letters[i] === ch && !shown) return false;
    this.letters[i] = ch; this.by[i] = ch ? by : ''; if (ts) this.ts[i] = ts;
    if (shown) this.shown.add(i);
    if (!this.started) this.started = dayStr();
    this.save();
    return true;
  }
  wrong(i) { const c = this.letters[i]; return !!c && c !== this.p.cells[i].answer; }
  get filled() { return this.p.letterCells.filter(i => this.letters[i]).length; }
  get correct() { return this.p.letterCells.filter(i => this.letters[i] === this.p.cells[i].answer).length; }
  get total() { return this.p.letterCells.length; }
  isFull() { return this.filled === this.total; }
  isSolved() { return this.p.letterCells.every(i => this.letters[i] === this.p.cells[i].answer); }
  wordFull(wi) { return this.p.words[wi].cells.every(i => this.letters[i]); }
  wordRight(wi) { return this.p.words[wi].cells.every(i => this.letters[i] === this.p.cells[i].answer); }
  wrongCells() { return this.p.letterCells.filter(i => this.wrong(i)); }
  // Status för listor och startsidan
  status() {
    if (this.done) return { key: 'done', text: 'Löst', pct: 100 };
    const f = this.filled;
    if (!f) return { key: 'new', text: 'Inte påbörjat', pct: 0 };
    const pct = Math.round(f / this.total * 100);
    return { key: 'going', text: `Påbörjat, ${pct} %`, pct };
  }
  reset() {
    this.letters.fill(''); this.by.fill(''); this.ts.fill(0); this.shown.clear();
    Object.assign(this, { secs: 0, hints: 0, checks: 0, done: false, doneAt: null, started: null });
    this.save(true);
  }
  // Hela läget (för den som kommer in i ett rum där andra redan har börjat)
  snapshot() { return { l: this.letters.map(c => c || '.').join(''), t: this.ts.slice(), b: this.by.slice(), s: [...this.shown] }; }
  merge(s) {
    let changed = false;
    [...s.l].forEach((c, i) => {
      const ch = c === '.' ? '' : c, t = s.t[i] || 0;
      if (t > this.ts[i] || (t === this.ts[i] && ch && !this.letters[i])) {
        if (this.letters[i] !== ch) changed = true;
        this.letters[i] = ch; this.ts[i] = t; this.by[i] = s.b ? s.b[i] || '' : '';
      }
    });
    (s.s || []).forEach(i => { if (!this.shown.has(i)) { this.shown.add(i); changed = true; } });
    if (changed) this.save();
    return changed;
  }
}
// Status för ett kryss utan att öppna det
function progressOf(puzzle) { return new Progress(puzzle).status(); }

/* ---- 03-sound.js ---- */
/* ================= Ljud: mjuka signaler och uppläsning ================= */
// Signalerna byggs med Web Audio (inga ljudfiler): ett mjukt klick för en bokstav, en liten ton när ett ord är klart
// och en slinga när krysset är löst. Inget ska låta hårt eller skrämmande.
const Sound = (() => {
  const S = {};
  let ctx = null, master = null;
  S.unlock = () => {
    try {
      if (!ctx) {
        ctx = new (window.AudioContext || window.webkitAudioContext)(); master = ctx.createGain(); master.gain.value = .45; master.connect(ctx.destination);
        // iPad och iPhone: ljudet ska höras även när tyst läge är på (Safari 16.4 och senare)
        try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) { /* äldre Safari */ }
      }
      if (ctx.state === 'suspended') ctx.resume();
    } catch (e) { ctx = null; }
  };
  S.context = () => { S.unlock(); return ctx; };
  const tone = (f, at, dur, { type = 'sine', vol = .3, attack = .01, release = .22, glide = 0 } = {}) => {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, at);
    if (glide) o.frequency.exponentialRampToValueAtTime(f * glide, at + dur);
    g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(vol, at + attack); g.gain.exponentialRampToValueAtTime(.0001, at + dur + release);
    o.connect(g); g.connect(master); o.start(at); o.stop(at + dur + release + .05);
  };
  const FX = {
    key(t) { tone(1320, t, .025, { vol: .05, release: .05, type: 'triangle' }); },
    erase(t) { tone(660, t, .03, { vol: .05, release: .06, type: 'triangle' }); },
    word(t) { tone(659.3, t, .1, { vol: .1 }); tone(880, t + .09, .16, { vol: .09 }); },
    wrong(t) { tone(330, t, .12, { vol: .07, glide: .9 }); },
    hint(t) { tone(987.8, t, .08, { vol: .08 }); tone(1318.5, t + .07, .12, { vol: .07 }); },
    solved(t) { [523.3, 659.3, 784, 1046.5, 1318.5].forEach((f, i) => tone(f, t + i * .12, .28, { vol: .13, type: 'triangle' })); },
    join(t) { tone(587.3, t, .12, { vol: .08 }); tone(784, t + .1, .18, { vol: .08 }); },
    pop(t) { tone(523.3, t, .06, { vol: .08, glide: 1.5 }); }
  };
  S.play = name => {
    if (!Settings.get('sound') || !ctx || !FX[name]) return;
    try { FX[name](ctx.currentTime + .01); } catch (e) { /* ljudet går inte just nu */ }
  };
  return S;
})();

// Uppläsningen: inspelade klipp (ElevenLabs, samma röst som plattan i Träffpunkt Hemma).
// VOICE_INFO från bygget: {lines: {id: {file, text, dur}}, packs: {kryssId: {file, clips: {ordIndex: [start, längd]}}}}.
// Ledtrådarna för ett kryss ligger i ett paket (en mp3 per kryss, 0,4 s tystnad mellan klippen). Paketet avkodas helt
// med Web Audio när krysset öppnas, och varje ledtråd spelas exakt från sin plats med lite av tystnaden före och efter.
// (Förut hoppade ett <audio>-element i mp3:n och stoppades av en timer. Hoppen i en mp3 är inte exakta och ljudet
// kommer igång olika fort, så början och slutet på en del ord klipptes bort.)
const Voice = (() => {
  const V = {};
  const info = VOICE_INFO || { lines: {}, packs: {} };
  const PRE = .15, POST = .25;          // sekunder av tystnaden före och efter klippet
  const buffers = new Map();            // kryssId -> Promise<AudioBuffer | null>
  let cur = null, node = null, token = 0;
  V.hasLine = id => !!(info.lines && info.lines[id]);
  V.hasPack = pid => !!(info.packs && info.packs[pid]);
  V.pack = pid => (info.packs && info.packs[pid]) || null;
  V.stop = () => {
    token++;
    if (cur) { try { cur.pause(); } catch (e) { /* redan stoppat */ } cur = null; }
    if (node) { try { node.stop(); } catch (e) { /* redan stoppat */ } node = null; }
  };
  V.say = id => {
    V.stop();
    const L = info.lines && info.lines[id];
    if (!L || !Settings.get('sound')) return false;
    try { cur = new Audio(L.file); cur.volume = .95; const p = cur.play(); if (p && p.catch) p.catch(() => {}); } catch (e) { return false; }
    return true;
  };
  // Hämta och avkoda paketet i förväg. En OfflineAudioContext avkodar utan att behöva ett tryck först.
  V.preparePack = pid => {
    if (!V.hasPack(pid) || buffers.has(pid)) return;
    const O = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    if (!O || typeof fetch !== 'function') return;
    let dec;
    try { dec = new O(1, 2, 44100); } catch (e) { return; }
    buffers.set(pid, fetch(info.packs[pid].file)
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.arrayBuffer(); })
      .then(b => new Promise((res, rej) => { const q = dec.decodeAudioData(b, res, rej); if (q && q.then) q.then(res, rej); }))
      .catch(() => { buffers.delete(pid); return null; }));   // försök igen nästa gång
    // bara de två senaste paketen hålls kvar (ett avkodat Stora kryss är några MB)
    while (buffers.size > 2) buffers.delete(buffers.keys().next().value);
  };
  // Läs upp ledtråden till ett ord i krysset (om det finns en inspelning)
  V.clue = (pid, wi) => {
    const P = info.packs && info.packs[pid];
    if (!P || !P.clips[wi] || !Settings.get('sound')) return false;
    V.stop();
    const ctx = Sound.context();
    V.preparePack(pid);
    const pending = buffers.get(pid);
    if (!ctx || !pending) return false;
    const my = token, [start, len] = P.clips[wi];
    pending.then(buf => {
      if (!buf || my !== token) return;         // stoppat, eller en annan ledtråd sedan dess
      const from = Math.max(0, start - PRE), dur = Math.min(buf.duration - from, start - from + len + POST);
      try {
        const src = ctx.createBufferSource(), g = ctx.createGain();
        src.buffer = buf; src.connect(g); g.connect(ctx.destination);
        const t = ctx.currentTime + .05;
        // mjuk in- och uttoning, i tystnaden före och efter talet
        g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.95, t + .02);
        g.gain.setValueAtTime(.95, t + dur - .04); g.gain.linearRampToValueAtTime(0, t + dur);
        src.onended = () => { if (node === src) node = null; };
        src.start(t, from, dur);
        node = src;
      } catch (e) { /* ljudet går inte just nu */ }
    });
    return true;
  };
  return V;
})();

/* ---- 04-settings.js ---- */
/* ================= Inställningar ================= */
// Sparas i webbläsaren. Standard: stort och tydligt, fel visas direkt, ljudet på.
const Settings = (() => {
  const DEF = {
    fs: 'normal',        // textstorlek: normal, stor, xstor
    dark: 'auto',        // mörk skärm: auto (som telefonen eller datorn), on eller off
    keys: 'abc',         // tangentbordet: abc (i bokstavsordning) eller qwerty (som på en dator)
    autoCheck: true,     // visa fel bokstäver direkt
    autoRead: false,     // läs upp ledtråden när man väljer ett ord
    sound: true,         // ljud och röst
    skipFilled: true,    // hoppa över ifyllda rutor när man skriver
    name: ''             // förnamnet som syns för de andra när man löser tillsammans
  };
  let cur = Object.assign({}, DEF, Store.get('settings', {}));
  if (cur.dark === true) cur.dark = 'on'; else if (cur.dark === false) cur.dark = 'auto';
  return {
    get: k => cur[k],
    all: () => Object.assign({}, cur),
    set(k, v) { cur[k] = v; Store.set('settings', cur); Bus.emit('settings', k, v); },
    DEF
  };
})();

/* ---- 05-fit.js ---- */
/* ================= Ledtrådstexten i de små rutorna ================= */
// Varje ledtråd ska få så stor text som möjligt i sin ruta (eller halva ruta). Texten bryts mellan orden. Ett ord
// avstavas bara när det behövs (hellre lite mindre text än ett avstavat ord), högst en gång per ord, med minst tre
// bokstäver på varje sida, och där det ser svenskt ut: före en konsonantgrupp som kan inleda ett ord (hamn-stad,
// Söder-slätt, land-skapet), annars före en ensam konsonant mellan vokaler (vi-ken). Luckan __ följer med ordet före.
const Fit = (() => {
  const F = {};
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  const cache = new Map();
  const VOW = /[aeiouyåäöé]/i;
  // konsonantgrupper som kan börja ett svenskt ord (längsta först)
  const ONSETS = ['skr', 'spr', 'str', 'spl', 'skv', 'sch', 'sk', 'sl', 'sm', 'sn', 'sp', 'st', 'sv', 'sj', 'tr', 'tv', 'tj', 'pr', 'pl', 'kr', 'kl', 'kn', 'kv', 'kj',
    'gr', 'gl', 'gn', 'gj', 'br', 'bl', 'bj', 'dr', 'dv', 'dj', 'fr', 'fl', 'fj', 'hj', 'lj', 'mj', 'nj', 'pj', 'vr'];
  const DIGRAPHS = ['ck', 'ng', 'sj', 'tj', 'dj', 'gj', 'hj', 'lj', 'kj', 'ch', 'sh', 'ph', 'th', 'qu'];
  let family = 'Atkinson Hyperlegible Next, Atkinson Hyperlegible, Verdana, sans-serif';
  F.setFamily = f => { family = f; cache.clear(); };
  const width = (s, px, wt) => { ctx.font = `${wt} ${px}px ${family}`; return ctx.measureText(s).width; };

  // Möjliga avstavningar i ett ord, bäst först: [{k, score}] där k betyder ord.slice(0, k) + '-' och ord.slice(k)
  function breaks(w, minSide = 3) {
    const lw = w.toLowerCase(), out = [];
    for (let k = minSide; k <= w.length - minSide; k++) {
      const a = lw[k - 1], b = lw[k];
      if (VOW.test(b)) continue;                                  // aldrig före en vokal
      if (DIGRAPHS.includes(a + b)) continue;                     // aldrig mitt i ck, ng, sj, tj …
      if (VOW.test(a)) {                                          // vokal + konsonant(er) + vokal: före den första konsonanten
        const rest = lw.slice(k);
        const onset = rest.match(/^[^aeiouyåäöé]+/)[0];
        if (onset.length > 1 && DIGRAPHS.includes(onset.slice(0, 2)) && onset.length > 2) continue;
        if (onset.length === 1 || ONSETS.includes(onset)) out.push({ k, score: onset.length > 1 ? 3 : 2 });
        continue;
      }
      // mitt i en konsonantgrupp: bara om det som blir kvar kan börja ett ord (hamn-stad, inte hamns-tad)
      const rest = lw.slice(k), onset = rest.match(/^[^aeiouyåäöé]+/)[0];
      if (ONSETS.includes(onset) || onset.length === 1) out.push({ k, score: onset.length > 1 ? 4 : 3 });
    }
    return out.sort((x, y) => y.score - x.score || Math.abs(w.length / 2 - x.k) - Math.abs(w.length / 2 - y.k));
  }
  // Radbryt texten till högst maxLines rader som var och en ryms i boxW. Ger raderna eller null.
  // hyph: 0 = aldrig avstava, 1 = högst en gång per ord med minst tre bokstäver per del, 2 = nödläge (två bokstäver)
  function wrap(text, px, wt, boxW, maxLines, hyph) {
    const words = text.replace(/ __/g, ' __').replace(/__ /g, '__ ').split(/ +/).filter(Boolean);
    const lines = [];
    let line = '';
    const fits = s => width(s, px, wt) <= boxW;
    for (const w of words) {
      const tryLine = line ? line + ' ' + w : w;
      if (fits(tryLine)) { line = tryLine; continue; }
      if (line && fits(w)) { lines.push(line); line = w; continue; }
      if (!hyph) return null;
      // ordet får inte plats på en rad: avstava en gång (två delar)
      if (line) { lines.push(line); line = ''; }
      const cand = breaks(w, hyph === 2 ? 2 : 3).filter(b => fits(w.slice(0, b.k) + '-') && fits(w.slice(b.k)));
      if (!cand.length) return null;
      lines.push(w.slice(0, cand[0].k) + '-');
      line = w.slice(cand[0].k);
      if (lines.length > maxLines) return null;
    }
    if (line) lines.push(line);
    return lines.length <= maxLines ? lines : null;
  }
  const tryAll = (text, boxW, boxH, px, wt, lh, hyph) => wrap(text, px, wt, boxW, Math.max(1, Math.floor(boxH / (px * lh))), hyph);
  // Största text som får plats: {px, lines}. Utan avstavning om texten då blir minst 85 % så stor.
  F.layout = (text, boxW, boxH, { max = 20, min = 6, weight = 600, lineHeight = 1.08 } = {}) => {
    const key = [text, Math.round(boxW), Math.round(boxH), max, min, weight, family].join('|');
    if (cache.has(key)) return cache.get(key);
    let plain = null, hyph = null;
    for (let px = max; px >= min && !plain; px -= .5) { const l = tryAll(text, boxW, boxH, px, weight, lineHeight, 0); if (l) plain = { px, lines: l }; }
    for (let px = max; px >= min && !hyph; px -= .5) { const l = tryAll(text, boxW, boxH, px, weight, lineHeight, 1); if (l) hyph = { px, lines: l }; }
    let best = plain && (!hyph || plain.px >= hyph.px * .85) ? plain : hyph;
    // nödläge: kortare delar, och till sist mindre text
    for (let px = min; !best && px >= 5; px -= .5) { const l = tryAll(text, boxW, boxH, px, weight, lineHeight, 2); if (l) best = { px, lines: l }; }
    if (!best) best = { px: 5, lines: text.split(/ +/) };
    cache.set(key, best);
    return best;
  };
  F.breaks = breaks;
  return F;
})();

/* ---- 06-grid.js ---- */
/* ================= Rutnätet ================= */
// Ritar krysset: bokstavsrutor med stora bokstäver och ledtrådsrutor med text och pilar, som i tidningen.
// Används av spelet, tv-läget och utskriften (olika storlek, samma utseende).
// Ordet man skriver i får en tydlig ram (inte bara en färg), och den gula rutan visar med en pil åt vilket håll
// bokstäverna hamnar. Pilen till det valda ordet blir blå, så att man ser vilken av två ledtrådar i en ruta som gäller.
class GridView {
  constructor(puzzle, { onCell = null, mode = 'play' } = {}) {
    this.p = puzzle; this.mode = mode; this.onCell = onCell;
    this.cs = 60; this.fs = 1;
    this.el = h('div.kx-grid', { class: 'kx-' + mode, role: 'grid', 'aria-label': puzzle.title, style: { '--w': puzzle.w, '--h': puzzle.h } });
    this.arrowEls = {};
    this.cellEls = puzzle.cells.map(c => {
      if (c.clue) {
        const parts = c.parts.map(wi => h('div.kx-qp', { 'data-w': wi }));
        return h('div.kx-q', { 'data-i': c.i, class: c.parts.length > 1 ? 'two' : c.parts.length ? '' : 'empty', style: { gridColumn: c.x + 1, gridRow: c.y + 1 } }, parts);
      }
      const e = h('div.kx-c', { 'data-i': c.i, role: 'gridcell', style: { gridColumn: c.x + 1, gridRow: c.y + 1 } }, h('span.kx-l'), h('span.kx-cd', { 'aria-hidden': 'true' }));
      if (c.marks.length) e.append(this.arrowSvg(c));
      return e;
    });
    this.frame = h('div.kx-frame', { 'aria-hidden': 'true', hidden: true });
    this.el.append(...this.cellEls, this.frame);
    if (onCell) this.el.addEventListener('pointerdown', e => {
      const t = e.target.closest('[data-i]');
      if (!t || !this.el.contains(t)) return;
      e.preventDefault();
      const part = e.target.closest('.kx-qp');
      onCell(+t.dataset.i, part ? +part.dataset.w : null, e);
    });
  }
  // Pilarna ritas i ordets första ruta, vid kanten mot ledtråden (0–100 i rutans koordinater). Varje ords pil är en
  // egen grupp, så att pilen till det valda ordet kan markeras.
  arrowSvg(c) {
    const NS = 'http://www.w3.org/2000/svg';
    const s = document.createElementNS(NS, 'svg');
    s.setAttribute('class', 'kx-ar'); s.setAttribute('viewBox', '0 0 100 100'); s.setAttribute('aria-hidden', 'true');
    const hasDR = c.marks.some(m => m.arrow === 'DR');
    for (const m of c.marks) {
      const y0 = m.part === 'top' ? 24 : m.part === 'bottom' ? 72 : 50;
      let d = '', tri = '';
      if (m.arrow === 'R') { d = `M0 ${y0}H12`; tri = `M12 ${y0 - 9}L25 ${y0}L12 ${y0 + 9}Z`; }
      else if (m.arrow === 'RD') { d = `M0 ${y0}H16V${y0 + 8}`; tri = `M7 ${y0 + 8}L16 ${y0 + 21}L25 ${y0 + 8}Z`; }
      else if (m.arrow === 'D') { const x0 = hasDR ? 66 : 50; d = `M${x0} 0V12`; tri = `M${x0 - 9} 12L${x0} 25L${x0 + 9} 12Z`; }
      else if (m.arrow === 'DR') { const x0 = 22; d = `M${x0} 0V16H${x0 + 8}`; tri = `M${x0 + 8} 7L${x0 + 21} 16L${x0 + 8} 25Z`; }
      const g = document.createElementNS(NS, 'g');
      g.setAttribute('class', 'kx-arw'); g.dataset.w = m.word;
      const pl = document.createElementNS(NS, 'path'); pl.setAttribute('d', d); pl.setAttribute('class', 'kx-ar-l');
      const pt = document.createElementNS(NS, 'path'); pt.setAttribute('d', tri); pt.setAttribute('class', 'kx-ar-t');
      g.append(pl, pt);
      s.append(g);
      (this.arrowEls[m.word] = this.arrowEls[m.word] || []).push(g);
    }
    return s;
  }
  // Rutornas storlek i pixlar; ledtrådstexten läggs om efter storleken (och textstorleken, fs)
  setSize(cs, fs = 1) {
    this.cs = cs; this.fs = fs;
    this.el.style.setProperty('--cs', cs + 'px');
    this.fitClues();
  }
  fitClues() {
    const cs = this.cs, pad = Math.max(1.5, cs * .045), fs = this.fs;
    const max = this.mode === 'print' ? cs * .26 : Math.min(cs * .27 * fs, (this.mode === 'tv' ? 34 : 26) * fs);
    for (const c of this.p.cells) {
      if (!c.clue || !c.parts.length) continue;
      const two = c.parts.length > 1;
      // två ledtrådar: den längre får mer av rutans höjd
      const lens = c.parts.map(wi => this.p.words[wi].text.length);
      const shares = two ? lens.map(l => clamp(l / (lens[0] + lens[1]), .38, .62)) : [1];
      c.parts.forEach((wi, k) => {
        const el = this.cellEls[c.i].children[k];
        const boxH = cs * shares[k] - pad * 2 - (two ? 1 : 0), boxW = cs - pad * 2;
        const L = Fit.layout(this.p.words[wi].text, boxW, boxH, { max, min: Math.min(7, max), weight: 600 });
        el.style.fontSize = L.px + 'px';
        el.style.flex = two ? `${shares[k]} 1 0` : '';
        el.replaceChildren(...L.lines.map(t => h('span', t)));
      });
    }
  }
  // Visa läget: bokstäverna, markeringen och de andras markörer (när man löser tillsammans)
  update(prog, { cur = -1, word = -1, dir = null, showWrong = false, peers = [], flash = null } = {}) {
    const P = this.p, wcells = word >= 0 ? new Set(P.words[word].cells) : null;
    for (const c of P.cells) {
      const e = this.cellEls[c.i];
      if (c.clue) {
        for (const pe of e.children) pe.classList.toggle('on', +pe.dataset.w === word);
        continue;
      }
      const ch = prog ? prog.get(c.i) : '';
      const l = e.firstChild;
      if (l.textContent !== ch) l.textContent = ch;
      e.classList.toggle('cur', c.i === cur);
      if (c.i === cur && dir) e.dataset.dir = dir; else if (e.dataset.dir) delete e.dataset.dir;
      e.classList.toggle('word', !!wcells && wcells.has(c.i) && c.i !== cur);
      e.classList.toggle('wrong', !!(showWrong && prog && prog.wrong(c.i)));
      e.classList.toggle('shown', !!(prog && prog.shown.has(c.i)));
      e.classList.toggle('flash', !!(flash && flash.has(c.i)));
      const peer = peers.find(x => x.cell === c.i);
      e.classList.toggle('peer', !!peer);
      if (peer) { e.style.setProperty('--peer', peer.color); e.dataset.peer = peer.name; } else if (e.dataset.peer) { delete e.dataset.peer; }
    }
    // pilarna: den till det valda ordet blir blå
    for (const [wi, gs] of Object.entries(this.arrowEls)) gs.forEach(g => g.classList.toggle('on', +wi === word));
    // ramen runt hela ordet
    if (word >= 0 && this.mode !== 'print') {
      const w = P.words[word], a = P.cells[w.cells[0]], b = P.cells[w.cells[w.len - 1]];
      this.frame.hidden = false;
      this.frame.style.gridColumn = `${a.x + 1} / ${b.x + 2}`;
      this.frame.style.gridRow = `${a.y + 1} / ${b.y + 2}`;
    } else this.frame.hidden = true;
  }
}

/* ---- 07-keys.js ---- */
/* ================= Tangentbordet på skärmen ================= */
// Stora knappar, inget som rättar eller gissar. Två lägen: bokstäverna i ordning (lättast för den som inte skriver
// på dator) och som på en dator. Plattans eget tangentbord används inte: det täcker halva skärmen och rättar ord.
const KEY_ROWS = {
  abc6: ['ABCDEF', 'GHIJKL', 'MNOPQR', 'STUVWX', 'YZÅÄÖ⌫'],
  abc10: ['ABCDEFGHIJ', 'KLMNOPQRST', 'UVWXYZÅÄÖ⌫'],
  qwerty: ['QWERTYUIOPÅ', 'ASDFGHJKLÖÄ', 'ZXCVBNM⌫']
};
function Keyboard({ onKey, onBack }) {
  const el = h('div.kx-keys', { role: 'group', 'aria-label': 'Tangentbord' });
  let layout = null;
  let last = { k: null, t: 0 };
  const press = (k, e) => {
    e.preventDefault();
    Sound.unlock();
    // samma tangent inom 150 ms räknas som ett darrigt dubbeltryck (dubbelbokstäver skriver man långsammare)
    const now = performance.now();
    if (k === last.k && now - last.t < 150) return;
    last = { k, t: now };
    if (k === '⌫') onBack(); else onKey(k);
    const b = e.currentTarget;
    b.classList.add('down');
    setTimeout(() => b.classList.remove('down'), 140);
  };
  const render = kind => {
    if (kind === layout) return;
    layout = kind;
    el.className = 'kx-keys kx-keys-' + kind;
    el.replaceChildren(...KEY_ROWS[kind].map(row => h('div.kx-krow', [...row].map(k => {
      const b = h('button.kx-key', { type: 'button', 'data-k': k, 'aria-label': k === '⌫' ? 'Sudda' : k, class: k === '⌫' ? 'kx-key-back' : '' });
      if (k === '⌫') { b.append(icon('erase', 30, 2)); b.append(h('span', 'Sudda')); } else b.textContent = k;
      b.addEventListener('pointerdown', e => press(k, e));
      return b;
    }))));
  };
  return { el, render };
}

/* ---- 08-board.js ---- */
/* ================= Spelplanen: krysset, den stora ledtråden, tangentbordet och hjälpen ================= */
// Board(root, puzzle, opts) bygger allt i root och sköter markeringen och skrivandet.
// opts: progress, readOnly (tv:n), peers (de andra när man löser tillsammans), onEvent(ev) (put, sel, solved),
//       onSolved(), embed (inbyggd i Träffpunkt Hemma).
// Tryck på en ledtråd: markera ordet. Tryck på en ruta: markera den och det ord som passar bäst (ordet man redan
// skriver i, annars ordet som börjar där, annars det som inte är fyllt). Tryck igen på samma ruta: byt håll (ett
// darrigt dubbeltryck inom en halv sekund räknas inte). Skriv med knapparna; när ordet är fullt stannar markören,
// och fler bokstäver skriver inte över den sista (man får i stället veta att ordet är klart).
class Board {
  constructor(root, puzzle, opts = {}) {
    this.root = root; this.p = puzzle; this.opts = opts;
    this.prog = opts.progress || new Progress(puzzle);
    this.readOnly = !!opts.readOnly;
    this.peers = opts.peers || [];
    this.checked = new Set();      // rutor som visas som fel efter "Rätta" (tills de ändras)
    this.flash = null;
    this.dir = 'A';
    this.cur = -1;
    this.grid = new GridView(puzzle, { onCell: this.readOnly ? null : (i, wi) => this.tap(i, wi), mode: this.readOnly ? 'tv' : 'play' });
    this.build();
    // börja i första ordet som inte är klart
    const first = puzzle.order.find(wi => !this.prog.wordFull(wi));
    this.selectWord(first != null ? first : puzzle.order[0], { silent: true });
    this.ro = new ResizeObserver(() => this.layout());
    this.ro.observe(root);
    if (this.clueBar) { this.ro2 = new ResizeObserver(() => { const hgt = this.clueBar.offsetHeight; if (hgt !== this._cbh) { this._cbh = hgt; this.layout(true); } }); this.ro2.observe(this.clueBar); }
    this.offSettings = Bus.on('settings', k => { if (k === 'keys' || k === 'fs') this.layout(true); this.refresh(); });
    this.onHide = () => this.prog.save(true);
    window.addEventListener('pagehide', this.onHide);
    document.addEventListener('visibilitychange', this.onHide);
    this.onKeyDown = e => this.physicalKey(e);
    if (!this.readOnly) window.addEventListener('keydown', this.onKeyDown);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (this.root.isConnected) { Fit.setFamily(getComputedStyle(this.grid.el).fontFamily); this.layout(true); } });
    this.lastAct = Date.now();
    this.tick = setInterval(() => { if (!document.hidden && !this.prog.done && !this.readOnly && Date.now() - this.lastAct < 120000) { this.prog.secs += 1; if (this.prog.secs % 10 === 0) this.prog.save(); } }, 1000);
    Voice.preparePack(puzzle.id);
    this.layout(true);
  }
  build() {
    const P = this.p;
    this.gridBox = h('div.kx-gridbox', this.grid.el);
    this.el = h('div.kx-board', { class: this.readOnly ? 'kx-ro' : '' }, this.gridBox);
    if (!this.readOnly) {
      this.cbDir = h('span.kx-cb-dir');
      this.cbLen = h('span.kx-cb-len');
      this.cbText = h('p.kx-cb-text', { 'aria-live': 'polite' });
      this.cbPattern = h('div.kx-cb-pat', { 'aria-hidden': 'true' });
      this.readBtn = btn('Läs upp', { icon: 'speaker', small: true, cls: 'kx-read', onClick: () => this.readClue(true) });
      if (!Voice.hasPack(P.id)) this.readBtn.hidden = true;
      const prev = btn('Förra', { icon: 'left', cls: 'kx-nav', title: 'Förra ledtråden', onClick: () => this.nextWord(-1) });
      this.nextBtn = btn('Nästa', { icon: 'right', cls: 'kx-nav', title: 'Nästa ledtråd', onClick: () => this.nextWord(1) });
      this.cbMsg = h('div.kx-cb-msg', { hidden: true, role: 'status' });
      this.clueBar = h('section.kx-cluebar', { 'aria-label': 'Ledtråden' },
        h('div.kx-cb-top', this.cbDir, this.cbLen, this.readBtn),
        h('div.kx-cb-mid', prev, this.cbText, this.nextBtn),
        this.cbPattern, this.cbMsg);
      this.keys = Keyboard({ onKey: k => this.input(k), onBack: () => this.erase() });
      this.swapBtn = btn('Skriv åt andra hållet', { icon: 'swap', small: true, onClick: () => this.toggleDir() });
      this.tools = h('div.kx-tools',
        btn('Visa en bokstav', { icon: 'bulb', small: true, onClick: () => this.reveal('cell') }),

    const fit = (aw, ah) => Math.floor(Math.min((aw - 6 - (P.w - 1)) / P.w, (ah - 6 - (P.h - 1)) / P.h));
    let cs;

      const fs = parseFloat(getComputedStyle(this.root).getPropertyValue('--fs')) || 1;

      this.el.classList.toggle('nopat', wide ? H < 660 : H < 780);

        this.el.style.setProperty('--kh', clamp((H - fixed) / rows - 6, 44, 76) + 'px');

    if (c.words.D >= 0 && c.words.A < 0) return 'D';
    if (this.word >= 0 && this.p.words[this.word].cells.includes(i)) return this.dir;       // i ordet man skriver i
    const starts = c.marks.map(m => this.p.words[m.word].dir);                            // ett ord börjar här
    if (starts.length === 1) return starts[0];
    const openA = !this.prog.wordFull(c.words.A), openD = !this.prog.wordFull(c.words.D);

      if (!c.parts.length) return;
      // en ruta med två ledtrådar: tryck på den halva man menar (eller tryck igen för den andra)
      let target = wi != null ? wi : c.parts[0];
      if (target === this.word && c.parts.length > 1 && wi == null) target = c.parts.find(x => x !== target);
      this.selectWord(target);

  nextWord(step) {

    for (let k = 0; k < P.words.length; k++) {

  input(ch) {

    const w = this.p.words[this.word];
    // markören kom inte längre (ordet är slut): skriv inte över det som står, tala om vad man kan göra i stället

    }
    this.hideMsg();
    Sound.play(Settings.get('autoCheck') && this.prog.wrong(i) ? 'wrong' : 'key');
    // nästa ruta i ordet, bara framåt (tomma rutor först om man vill hoppa förbi det som står). Finns ingen stannar
    // markören, och nästa bokstav skriver inte över något.

  erase() {

    let i = this.cur;
    const w = this.p.words[this.word];

    }

  }
  move(dx, dy) {
    const P = this.p;
    let { x, y } = P.cells[this.cur];
    for (let n = 0; n < Math.max(P.w, P.h); n++) {

  reveal(what) {

    const w = this.p.words[this.word];
    const need = c => this.prog.get(c) !== this.p.cells[c].answer && !this.prog.shown.has(c);
    let cells;
    if (what === 'word') cells = w.cells;
    else cells = need(this.cur) ? [this.cur] : [w.cells.find(need)].filter(c => c != null);
    let n = 0;
    for (const i of cells) {

      this.checked.delete(i);

    this.say(n ? `${n} ${n === 1 ? 'bokstav är fel' : 'bokstäver är fel'}. De är röda.` : this.prog.filled ? 'Allt du har skrivit är rätt!' : 'Skriv några bokstäver först.', n ? 'pencil' : 'check');
    Sound.play(n ? 'wrong' : 'word');
  }
  afterChange(wi) {

      const cells = this.p.words[wi].cells;
      if (!this._lastRight || this._lastRight !== wi + ':' + cells.map(c => this.prog.get(c)).join('')) {

  }
  checkSolved() {

  }
  // Meddelanden: egna rutor, eller värdens (Träffpunkt Hemma har sina egna)
  say(text, ic = 'check', ms = 8000) {

/* ---- 09-daily.js ---- */
/* ================= Dagens kryss och alla kryss ================= */
// Varje dag har ett Lilla kryss och ett Stora kryss, samma för alla (så att man kan prata om dem med varandra).
// Kryssen går runt i en bestämd ordning från START; ett nytt kryss kommer vid midnatt.
const Daily = (() => {
  const D = {};
  D.START = '2026-09-01';
  const raw = (PUZZLE_DATA && PUZZLE_DATA.puzzles) || [];
  const bySize = { L: raw.filter(p => p.size === 'L' && !p.theme), S: raw.filter(p => p.size === 'S' && !p.theme) };
  // Temakryss (till exempel Trelleborgskrysset): utanför dagens kryss, i en egen lista
  D.themed = () => raw.filter(p => p.theme).map(p => D.get(p.id));
  const cache = new Map();
  D.get = id => {
    if (cache.has(id)) return cache.get(id);
    const d = raw.find(p => p.id === id);
    if (!d) return null;
    const p = new Puzzle(d);
    cache.set(id, p);
    return p;
  };
  D.count = size => bySize[size].length;
  D.forDay = (day = dayStr(), size = 'L') => {
    const list = bySize[size];
    if (!list.length) return null;
    const n = daysBetween(D.START, day);
    return D.get(list[((n % list.length) + list.length) % list.length].id);
  };
  // Vilken dag ett kryss är "dagens" (senaste gången, till och med i dag)
  D.dayOf = id => {
    const p = raw.find(x => x.id === id);
    if (!p || p.theme) return null;
    const list = bySize[p.size], k = list.findIndex(x => x.id === id), n = daysBetween(D.START, dayStr());
    if (n < 0) return null;
    const back = ((n - k) % list.length + list.length) % list.length;
    return addDays(dayStr(), -back);
  };
  // De senaste dagarna (för listan med tidigare kryss)
  D.recent = (days = 21) => Array.from({ length: days }, (_, k) => addDays(dayStr(), -k)).filter(d => daysBetween(D.START, d) >= 0);
  return D;
})();

/* ---- 10-ui.js ---- */
/* ================= Rutor, meddelanden och små byggstenar ================= */
// Meddelande uppe till höger som försvinner av sig själv
function toast(text, { icon: ic = 'check', ms = 4200 } = {}) {
  let box = $('.toasts');
  if (!box) { box = h('div.toasts', { 'aria-live': 'polite' }); document.body.append(box); }
  const t = h('div.toast', h('span.toast-ic', icon(ic, 26)), h('p', text));
  box.append(t);
  while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 350); }, ms);
  return t;
}

// Ruta mitt på skärmen. Ger {el, close}. Stängs med Esc eller tryck utanför (inte de första 350 ms, så att en
// dubbeltryckning inte stänger den direkt).
function sheet({ title, icon: ic = null, body = [], buttons = [], wide = false, dismiss = true, onClose = null, cls = '' } = {}) {
  const opened = performance.now();
  const bg = h('div.sheet-bg');
  const close = () => { if (!bg.isConnected) return; bg.classList.add('out'); document.removeEventListener('keydown', esc); setTimeout(() => bg.remove(), 200); onClose && onClose(); };
  const esc = e => { if (e.key === 'Escape' && dismiss) close(); };
  const box = h('div.sheet', { role: 'dialog', 'aria-modal': 'true', 'aria-label': title || '', class: cx(wide && 'wide', cls) },
    title && h('header.sheet-h', ic && h('span.sheet-ic', icon(ic, 30)), h('h2', title), dismiss && (() => { const b = btn('', { icon: 'x', kind: 'ghost', cls: 'sheet-x', title: 'Stäng', onClick: close }); b.setAttribute('aria-label', 'Stäng'); return b; })()),
    h('div.sheet-body', body),
    buttons.length && h('footer.sheet-f', buttons.map(b => b instanceof Node ? b : btn(b.label, Object.assign({}, b, { onClick: () => { if (b.keep !== true) close(); b.onClick && b.onClick(); } })))));
  bg.append(box);
  bg.addEventListener('pointerdown', e => { if (e.target === bg && dismiss && performance.now() - opened > 350) close(); });
  document.addEventListener('keydown', esc);
  ($('#app') || document.body).append(bg);
  const f = box.querySelector('footer .btn-primary') || box.querySelector('button');
  if (f) setTimeout(() => f.focus({ preventScroll: true }), 50);
  return { el: box, close };
}
function confirmSheet(title, text, { yes = 'Ja', no = 'Nej', icon: ic = 'help', danger = false } = {}) {
  return new Promise(res => {
    let answered = false;
    sheet({ title, icon: ic, body: [h('p.lead', text)], onClose: () => { if (!answered) res(false); },
      buttons: [{ label: yes, kind: danger ? 'danger' : 'primary', big: true, onClick: () => { answered = true; res(true); } }, { label: no, big: true, onClick: () => { answered = true; res(false); } }] });
  });
}

// Stor av/på-knapp med text

// Val mellan några alternativ (stora knappar)
function choiceRow(label, key, options, { onChange = null } = {}) {

// Litet rutnät som bild (på startsidan och i listorna): ledtrådsrutor grå, ifyllda rutor mörka
function miniGrid(p, prog = null, size = 120) {
  const cs = Math.floor(size / Math.max(p.w, p.h));
  const c = h('canvas.mini', { width: p.w * cs * 2, height: p.h * cs * 2, 'aria-hidden': 'true', style: { width: p.w * cs + 'px', height: p.h * cs + 'px' } });
  const g = c.getContext('2d');
  g.scale(2, 2);
  const css = getComputedStyle(document.querySelector('.kk, .senior') || document.body);
  const col = n => css.getPropertyValue(n).trim() || '#888';
  g.fillStyle = col('--g-line'); g.fillRect(0, 0, p.w * cs, p.h * cs);
  for (const cell of p.cells) {
    g.fillStyle = cell.clue ? col('--g-clue') : prog && prog.get(cell.i) ? col('--primary') : col('--g-cell');
    g.fillRect(cell.x * cs + .5, cell.y * cs + .5, cs - 1, cs - 1);
  }
  return c;
}

/* ---- 12-mqtt.js ---- */
/* ================= Meddelanden över internet (MQTT) ================= */
// Spelarna hittar varandra och skickar dragen via öppna MQTT-servrar (publika "brokers") över krypterade
// WebSockets. Det fungerar genom alla hemnätverk och mobilnät utan egen server. För säkerhets skull ansluter
// spelet till flera servrar samtidigt och skickar allt till alla. Dubbletter känns igen och kastas.
// Litet eget MQTT 3.1.1-bibliotek: CONNECT, SUBSCRIBE, PUBLISH (QoS 0), PING och "last will" (ett bye-meddelande
// som servern skickar om anslutningen bryts oväntat).
const Mqtt = (() => {
  const M = {};
  M.BROKERS = [
    'wss://test.mosquitto.org:8081/mqtt',
    'wss://broker.emqx.io:8084/mqtt',
    'wss://broker.hivemq.com:8884/mqtt'
  ];
  M.cid = 'c' + randId(10);
  const enc = new TextEncoder(), dec = new TextDecoder();
  const u16 = n => [n >> 8 & 255, n & 255];
  const str = s => { const b = enc.encode(s); return [...u16(b.length), ...b]; };
  const remLen = n => { const out = []; do { let d = n % 128; n = Math.floor(n / 128); if (n > 0) d |= 128; out.push(d); } while (n > 0); return out; };
  const packet = (type, body) => { const b = body instanceof Uint8Array ? body : new Uint8Array(body); const h = [type, ...remLen(b.length)]; const out = new Uint8Array(h.length + b.length); out.set(h); out.set(b, h.length); return out; };

  let seq = 0, will = null;
  const subs = new Map();        // topic -> Set(handler)
  const conns = [];
  const seen = new Map();        // avsändare -> {set, list}
  const listeners = new Set();
  M.onChange = fn => { listeners.add(fn); return () => listeners.delete(fn); };
  const changed = () => listeners.forEach(fn => { try { fn(M.connected()); } catch (e) { console.error(e); } });

  class Conn {
    constructor(url) { this.url = url; this.ws = null; this.state = 'off'; this.pid = 1; this.buf = new Uint8Array(0); this.retry = 0; this.timer = 0; this.ping = 0; this.lastRx = 0; }
    open() {
      if (this.state === 'connecting' || this.state === 'on') return;
      this.state = 'connecting';
      let ws;
      try { ws = new WebSocket(this.url, ['mqtt']); } catch (e) { this.fail(); return; }
      this.ws = ws; ws.binaryType = 'arraybuffer';
      const guard = setTimeout(() => { if (this.state === 'connecting') { try { ws.close(); } catch (e) { /* stängd */ } this.fail(); } }, 9000);
      ws.onopen = () => {
        const flags = 0x02 | (will ? 0x04 : 0);
        const body = [...str('MQTT'), 4, flags, ...u16(40), ...str(M.cid + this.url.length.toString(36))];
        if (will) body.push(...str(will.topic), ...str(will.payload));
        ws.send(packet(0x10, body));
      };
      ws.onmessage = ev => { this.lastRx = Date.now(); this.read(new Uint8Array(ev.data)); };
      ws.onerror = () => {};
      ws.onclose = () => { clearTimeout(guard); if (this.ws === ws) this.fail(); };
      this.connGuard = guard;
    }
    fail() {
      const was = this.state;
      this.state = 'off'; this.ws = null;
      clearInterval(this.ping);
      if (was === 'on') changed();
      if (this.closing) return;
      const delay = [1500, 3000, 6000, 12000, 20000][Math.min(4, this.retry++)];
      clearTimeout(this.timer);
      this.timer = setTimeout(() => this.open(), delay);
    }
    read(d) {
      const nb = new Uint8Array(this.buf.length + d.length); nb.set(this.buf); nb.set(d, this.buf.length); this.buf = nb;
      for (;;) {
        if (this.buf.length < 2) return;
        let mul = 1, len = 0, i = 1, byte;
        do { if (i >= this.buf.length) return; byte = this.buf[i++]; len += (byte & 127) * mul; mul *= 128; } while (byte & 128);
        if (this.buf.length < i + len) return;
        const first = this.buf[0], type = first >> 4, qos = (first >> 1) & 3, body = this.buf.slice(i, i + len);
        this.buf = this.buf.slice(i + len);
        if (type === 2) {
          clearTimeout(this.connGuard);
          if (body[1] !== 0) { try { this.ws.close(); } catch (e) { /* stängd */ } return; }
          this.state = 'on'; this.retry = 0; this.lastRx = Date.now();
          for (const t of subs.keys()) this.sub(t);
          clearInterval(this.ping);
          this.ping = setInterval(() => {
            if (this.state !== 'on') return;
            if (Date.now() - this.lastRx > 50000) { try { this.ws.close(); } catch (e) { /* stängd */ } return; }
            this.send(new Uint8Array([0xC0, 0]));
          }, 15000);
          changed();
        } else if (type === 3) {
          const tl = (body[0] << 8) | body[1];
          const topic = dec.decode(body.subarray(2, 2 + tl));
          const payload = dec.decode(body.subarray(2 + tl + (qos ? 2 : 0)));
          deliver(topic, payload);
        }
      }
    }
    send(p) { try { if (this.ws && this.ws.readyState === 1) this.ws.send(p); } catch (e) { /* tappad */ } }
    sub(topic) { if (this.state === 'on') this.send(packet(0x82, [...u16(this.pid++ & 0xffff || 1), ...str(topic), 0])); }
    unsub(topic) { if (this.state === 'on') this.send(packet(0xA2, [...u16(this.pid++ & 0xffff || 1), ...str(topic)])); }
    pub(topic, payload) { if (this.state === 'on') this.send(packet(0x30, [...str(topic), ...enc.encode(payload)])); }
    close() { this.closing = true; clearTimeout(this.timer); clearInterval(this.ping); try { this.send(new Uint8Array([0xE0, 0])); this.ws && this.ws.close(); } catch (e) { /* stängd */ } this.state = 'off'; }
  }

  function deliver(topic, payload) {
    let msg;
    try { msg = JSON.parse(payload); } catch (e) { return; }
    if (!msg || typeof msg !== 'object' || typeof msg.f !== 'string') return;
    if (msg.f === M.cid) return;           // egna meddelanden
    // samma meddelande kommer från flera servrar: släpp bara igenom det första
    if (msg.n) {
      let s = seen.get(msg.f);
      if (!s) { s = {set: new Set(), list: []}; seen.set(msg.f, s); }
      if (s.set.has(msg.n)) return;
      s.set.add(msg.n); s.list.push(msg.n);
      if (s.list.length > 400) s.set.delete(s.list.shift());
    }
    const hs = subs.get(topic);
    if (hs) hs.forEach(fn => { try { fn(msg, topic); } catch (e) { console.error(e); } });
  }

  M.start = () => {
    if (conns.length) { conns.forEach(c => { if (c.state === 'off') { c.retry = 0; c.open(); } }); return; }
    M.BROKERS.forEach(u => { const c = new Conn(u); conns.push(c); c.open(); });
  };
  M.setWill = (topic, obj) => { will = {topic, payload: JSON.stringify(Object.assign({f: M.cid, n: 0}, obj))}; };
  M.connected = () => conns.filter(c => c.state === 'on').length;
  M.started = () => conns.length > 0;
  // Väntar tills minst en server är ansluten
  M.ready = (ms = 10000) => new Promise(res => {
    if (M.connected()) return res(true);
    M.start();
    const off = M.onChange(n => { if (n) { off(); clearTimeout(t); res(true); } });
    const t = setTimeout(() => { off(); res(M.connected() > 0); }, ms);
  });
  M.sub = (topic, fn) => {
    let hs = subs.get(topic);
    if (!hs) { hs = new Set(); subs.set(topic, hs); conns.forEach(c => c.sub(topic)); }
    hs.add(fn);
    return () => { hs.delete(fn); if (!hs.size) { subs.delete(topic); conns.forEach(c => c.unsub(topic)); } };
  };
  M.pub = (topic, obj) => {
    const payload = JSON.stringify(Object.assign({f: M.cid, n: ++seq}, obj));
    conns.forEach(c => c.pub(topic, payload));
    return payload.length;
  };
  M.stop = () => { conns.forEach(c => c.close()); conns.length = 0; };
  // Tillbaka från bakgrunden: se till att anslutningarna lever
  if (typeof document !== 'undefined' && document.addEventListener) document.addEventListener('visibilitychange', () => { if (!document.hidden && conns.length) conns.forEach(c => { if (c.state === 'off') { c.retry = 0; clearTimeout(c.timer); c.open(); } }); });
  return M;
})();

/* ---- 13-net.js ---- */
/* ================= Lös tillsammans: samma kryss på flera skärmar ================= */
// Ett rum har en kod med fyra bokstäver. Den som skapar rummet (värden) håller krysset; den som kommer in får
// krysset och alla bokstäver av värden (eller av någon annan som är med, om värden är borta). Varje bokstav skickas
// till alla med en tidsstämpel; den senaste vinner, så att alla ser samma kryss. Meddelandena går via öppna
// MQTT-servrar (Mqtt, samma som i de andra klubbspelen). Inget konto, bara ett förnamn.
// Meddelanden (fältet n är upptaget av Mqtt): hi, st (läget), put, sel, ping, bye, done.
const PEER_COLORS = ['#D9480F', '#2B8A3E', '#7048E8', '#C2255C', '#1971C2', '#B35C00', '#0B7285', '#5F3DC4'];
const Net = (() => {
  const N = {};
  N.me = Store.get('dev', null);
  if (!N.me) { N.me = randId(10); Store.set('dev', N.me); }
  N.room = null;
  const TOPIC = code => `korsordsklubben/v1/r/${code}`;
  let off = null, pingT = null, answerT = null;
  N.available = () => !ARTIFACT && typeof WebSocket !== 'undefined';
  N.newCode = () => Array.from(crypto.getRandomValues(new Uint8Array(4)), b => 'ABCDEFGHJKLMNPRSTUVXYZ'[b % 22]).join('');
  const myName = () => (Settings.get('name') || '').trim() || 'Gäst';
  const colorFor = id => { let x = 0; for (const c of id) x = (x * 31 + c.charCodeAt(0)) >>> 0; return PEER_COLORS[x % PEER_COLORS.length]; };
  N.colorFor = colorFor;
  const send = obj => { if (N.room) Mqtt.pub(TOPIC(N.room.code), Object.assign({ id: N.me }, obj)); };

  // Skapa ett rum för ett kryss (värd). tv: tv:n på träffpunkten är värd men skriver inte själv.
  N.create = (pid, { tv = false } = {}) => {
    const code = N.newCode();
    Store.set('room', { code, pid, host: true, tv, at: Date.now() });
    return code;
  };
  // Gå in i ett rum. Ger ett löfte som blir klart när krysset finns (värdens eller eget sparat läge).
  N.join = (code, { tv = false } = {}) => new Promise((resolve, reject) => {
    N.leave();
    code = code.toUpperCase();
    const saved = Store.get('room', null);
    const host = !!(saved && saved.code === code && saved.host);
    N.room = { code, host, tv: tv || !!(host && saved.tv), pid: host ? saved.pid : null, puzzle: null, prog: null, peers: new Map(), hostSeen: false, last: null };
    const R = N.room;
    if (host) {
      const p = Daily.get(saved.pid);
      if (!p) { reject(new Error('Krysset finns inte.')); return; }
      R.puzzle = p; R.prog = new Progress(p, { key: 'r.' + code });
    } else {
      // har jag varit med förut? Då finns krysset sparat
      const mine = Store.get('rp.' + code, null);
      if (mine && mine.pz) { R.puzzle = new Puzzle(mine.pz); R.prog = new Progress(R.puzzle, { key: 'r.' + code }); }
    }
    Mqtt.setWill(TOPIC(code), { t: 'bye', id: N.me });
    Mqtt.start();
    off = Mqtt.sub(TOPIC(code), onMsg);
    const hello = () => send({ t: 'hi', nm: myName(), role: R.tv ? 'tv' : 'p', host: R.host ? 1 : 0 });
    Mqtt.ready(12000).then(ok => {
      if (!ok) { if (R.puzzle) resolve(R); else reject(new Error('Kommer inte ut på internet just nu.')); return; }
      hello();
      pingT = setInterval(() => { send({ t: 'ping', nm: myName(), role: R.tv ? 'tv' : 'p', c: App.board ? App.board.cur : -1 }); prune(); }, 12000);
      if (R.puzzle) resolve(R);
      else {
        R.onState = () => resolve(R);
        // svarar ingen på en stund: fråga igen, och ge upp efter en halv minut
        let tries = 0;
        const again = setInterval(() => { if (R.puzzle || !N.room || N.room !== R) { clearInterval(again); return; } if (++tries > 5) { clearInterval(again); reject(new Error('Hittar inget rum med den koden. Kontrollera koden, eller be den som bjöd in att öppna rummet igen.')); } else hello(); }, 5000);
      }
    });
  });
  N.leave = () => {
    if (!N.room) return;
    send({ t: 'bye' });
    if (off) off();
    off = null;
    clearInterval(pingT); clearTimeout(answerT);
    N.room = null;
    Bus.emit('net:peers');
  };
  // Lämna rummet när man går till en annan sida (men inte när man laddar om eller går till samma rum)
  N.leaveIfNot = hash => { if (N.room && !hash.includes(N.room.code)) N.leave(); };
  function prune() {
    const R = N.room; if (!R) return;
    let changed = false;
    for (const [id, p] of R.peers) if (Date.now() - p.seen > 40000) { R.peers.delete(id); changed = true; }
    if (changed) Bus.emit('net:peers');
  }
  function peer(m) {
    const R = N.room;
    let p = R.peers.get(m.id);
    const isNew = !p;
    if (!p) { p = { id: m.id, name: m.nm || 'Gäst', color: colorFor(m.id), cell: -1, dir: 'A', role: m.role || 'p', seen: Date.now() }; R.peers.set(m.id, p); }
    if (m.nm) p.name = m.nm;
    if (m.role) p.role = m.role;
    p.seen = Date.now();
    if (isNew) Bus.emit('net:peers', { joined: p });
    return p;
  }
  function onMsg(m) {
    const R = N.room;
    if (!R || !m || m.id === N.me) return;
    if (m.t === 'bye') { if (R.peers.delete(m.id)) Bus.emit('net:peers', { left: m.id }); return; }
    const p = peer(m);
    if (m.host) R.hostSeen = true;
    if (m.t === 'hi') {
      // någon ny: värden svarar med krysset och läget; är värden borta svarar den som har lägst id efter en stund
      if (R.puzzle && R.prog) {
        const reply = () => send({ t: 'st', to: m.id, pz: R.puzzle.data, snap: R.prog.snapshot(), peers: [...R.peers.values()].filter(x => x.id !== m.id).map(x => ({ id: x.id, nm: x.name, role: x.role })), host: R.host ? 1 : 0 });
        if (R.host) reply();
        else {
          clearTimeout(answerT);
          const others = [...R.peers.keys(), N.me].sort();
          if (others[0] === N.me) answerT = setTimeout(reply, 1500 + Math.random() * 800);
        }
      }
      // säg hej tillbaka så att den nya ser mig
      send({ t: 'ping', nm: myName(), role: R.tv ? 'tv' : 'p', c: App.board ? App.board.cur : -1, host: R.host ? 1 : 0 });
    } else if (m.t === 'st') {
      if (m.to !== N.me) { clearTimeout(answerT); return; }
      if (!R.puzzle) {
        R.puzzle = new Puzzle(m.pz);
        R.pid = m.pz.id;
        R.prog = new Progress(R.puzzle, { key: 'r.' + R.code });
        Store.set('rp.' + R.code, { pz: m.pz, at: Date.now() });
      }
      (m.peers || []).forEach(x => peer({ id: x.id, nm: x.nm, role: x.role }));
      if (R.prog.merge(m.snap)) Bus.emit('net:state');
      if (R.onState) { const f = R.onState; R.onState = null; f(); }
    } else if (m.t === 'put') {
      if (!R.prog) return;
      p.cell = m.c; R.last = { id: m.id, at: Date.now(), cell: m.c };
      Bus.emit('net:put', { cell: m.c, ch: m.ch || '', ts: m.ts, by: p.name, shown: !!m.sh, peer: p });
    } else if (m.t === 'sel') {
      p.cell = m.c; p.dir = m.d; R.last = { id: m.id, at: Date.now(), cell: m.c, dir: m.d };
      Bus.emit('net:peers', { moved: p });
    } else if (m.t === 'ping') {
      if (m.c != null && m.c >= 0) p.cell = m.c;
      Bus.emit('net:peers');
    } else if (m.t === 'done') {
      Bus.emit('net:done', p);
    }
  }
  N.put = (cell, ch, ts, shown = false) => send({ t: 'put', c: cell, ch, ts, sh: shown ? 1 : 0, nm: myName() });
  N.sel = (cell, dir) => send({ t: 'sel', c: cell, d: dir, nm: myName() });
  N.done = () => send({ t: 'done', nm: myName() });
  N.peers = () => N.room ? [...N.room.peers.values()] : [];
  N.link = code => {
    const base = /^https?:/.test(location.href) && !/^(localhost|127\.)/.test(location.hostname) ? location.origin + location.pathname : SITE_URL;
    return base + '#rum=' + code;
  };
  return N;
})();

/* ---------- Skärmarna för att lösa tillsammans ---------- */
const Together = (() => {

        else if (ev.type === 'sel') Net.sel(ev.cell, ev.dir);
        else if (ev.type === 'solved') Net.done();
      },
      onSolved: () => Screens.solved(p, R.prog),
      onRefresh: b => { count.textContent = `${b.prog.filled} av ${b.prog.total}`; }
    });
    App.board = board;
    const drawPeers = () => {
      const ps = Net.peers();
      board.setPeers(ps.filter(x => x.role !== 'tv' && x.cell >= 0).map(x => ({ cell: x.cell, color: x.color, name: x.name })));
